
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Smart Parking</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2f7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-box {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 32px;
            border-radius: 14px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #183153;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #667085;
            text-align: center;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd3dd;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #183153;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #254a78;
        }

        .message {
            background: #fff0f0;
            color: #a32020;
            padding: 10px;
            border-radius: 6px;
        }

        .back-link {
            text-align: center;
            margin-top: 22px;
        }

        a {
            color: #1769aa;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>Admin Login</h1>
        <p class="subtitle">Smart Parking Management System</p>

        {% if message %}
        <p class="message">{{ message }}</p>
        {% endif %}

        <form action="/admin-login" method="POST">
            <label for="email">Admin Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter admin email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter admin password"
                required
            >

            <button type="submit">Login as Admin</button>
        </form>

        <p class="back-link">
            <a href="/">Back to Home</a>
        </p>
    </div>
</body>
</html>
